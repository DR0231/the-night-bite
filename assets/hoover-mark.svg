<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 56" width="160" height="56" role="img" aria-label="Hoover Reservoir silhouette">
  <!-- Pixel Hoover mark: long N–S lake, dam south, causeway pinch, creek arms -->
  <!-- water fill (navy-mid lake on deeper navy) -->
  <rect x="0" y="0" width="160" height="56" fill="none"/>
  <!-- North creek arms / Big Walnut fingers -->
  <rect x="58" y="2" width="10" height="4" fill="#3d7a9a"/>
  <rect x="52" y="4" width="8" height="4" fill="#3d7a9a"/>
  <rect x="72" y="2" width="8" height="4" fill="#3d7a9a"/>
  <rect x="78" y="4" width="6" height="4" fill="#3d7a9a"/>
  <rect x="44" y="6" width="6" height="4" fill="#3d7a9a"/>
  <rect x="86" y="6" width="6" height="4" fill="#3d7a9a"/>
  <!-- Upper basin (wider) -->
  <rect x="48" y="8" width="52" height="6" fill="#4a8fb0"/>
  <rect x="46" y="12" width="56" height="6" fill="#4a8fb0"/>
  <rect x="50" y="16" width="48" height="4" fill="#4a8fb0"/>
  <!-- Causeway / Smothers pinch -->
  <rect x="58" y="20" width="32" height="4" fill="#3d7a9a"/>
  <rect x="54" y="20" width="4" height="4" fill="#1e2a3a"/>
  <rect x="90" y="20" width="4" height="4" fill="#1e2a3a"/>
  <rect x="62" y="19" width="24" height="2" fill="#243044"/>
  <!-- Middle basin -->
  <rect x="52" y="24" width="44" height="6" fill="#4a8fb0"/>
  <rect x="50" y="28" width="48" height="6" fill="#4a8fb0"/>
  <!-- Side creek arm (east) -->
  <rect x="98" y="26" width="10" height="4" fill="#3d7a9a"/>
  <rect x="106" y="24" width="8" height="4" fill="#3d7a9a"/>
  <!-- Side creek arm (west / Oxbow-ish) -->
  <rect x="40" y="28" width="10" height="4" fill="#3d7a9a"/>
  <rect x="34" y="30" width="8" height="4" fill="#3d7a9a"/>
  <!-- Lower basin toward dam -->
  <rect x="54" y="34" width="40" height="6" fill="#4a8fb0"/>
  <rect x="56" y="38" width="36" height="4" fill="#4a8fb0"/>
  <rect x="60" y="42" width="28" height="4" fill="#3d7a9a"/>
  <!-- Dam / south end -->
  <rect x="58" y="46" width="32" height="4" fill="#243044"/>
  <rect x="56" y="48" width="36" height="3" fill="#1e2a3a"/>
  <rect x="62" y="50" width="24" height="2" fill="#162030"/>
  <!-- tiny lantern glint on dam -->
  <rect x="84" y="44" width="2" height="2" fill="#f0a830" opacity="0.85"/>
</svg>
