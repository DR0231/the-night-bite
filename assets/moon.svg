<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Moon">
  <!-- soft glow for night-navy scene — no hard navy cutout -->
  <circle cx="16" cy="16" r="14" fill="#f0a830" opacity="0.12"/>
  <circle cx="16" cy="16" r="11" fill="#f5e6c8" opacity="0.18"/>
  <!-- cream moon body -->
  <circle cx="15" cy="16" r="9" fill="#e8d5a3"/>
  <!-- soft shade (crescent feel) blended, not a punched hole -->
  <path d="M18 7.5c3.8 1.2 6.5 4.8 6.5 8.5S21.8 23.3 18 24.5c2.2-1.1 3.6-3.5 3.6-6.2S20.2 9.8 18 7.5z" fill="#c9b48a" opacity="0.55"/>
  <!-- pixel craters -->
  <rect x="10" y="14" width="2" height="2" fill="#d4c090" opacity="0.55"/>
  <rect x="14" y="19" width="2" height="2" fill="#d4c090" opacity="0.4"/>
  <rect x="12" y="11" width="1" height="1" fill="#d4c090" opacity="0.45"/>
  <!-- warm rim glow -->
  <circle cx="15" cy="16" r="9" fill="none" stroke="#f0a830" stroke-width="1" opacity="0.35"/>
</svg>
